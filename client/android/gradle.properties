org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP's optimizeReleaseResources step drops res/raw/ring_incoming.mp3 from
# release builds: the only thing referencing it is a Dart string handed to
# the notifications plugin at runtime, so the optimizer sees no R.raw
# reference and considers it unused. Losing it makes incoming calls ring
# silently. (Verified by diffing the pre- and post-optimize resource
# archives.)
android.enableResourceOptimizations=false
