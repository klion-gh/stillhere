name: stillhere
description: StillHere — private messenger for chat and calls.
publish_to: "none"
version: 0.3.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: ^1.6.0
  intl: ^0.19.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
