name: stillhere
description: StillHere — private messenger for chat and calls.
publish_to: "none"
# The +N build number becomes Android's versionCode. It must increase on
# every release — Android compares versionCode (not the name) when deciding
# whether an APK is an update, and refuses to install a lower one.
version: 0.12.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: ^1.6.0
  intl: ^0.19.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  # Works on Android and Windows alike, unlike image_picker which has no
  # desktop implementation.
  file_selector: ^1.0.3
  image: ^4.3.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  local_notifier: ^0.1.6
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
